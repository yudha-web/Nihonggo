<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo-fy Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="spotify-wrapper">
        <nav class="sidebar">
            <div class="logo-container" id="logo">
                <i class="fa-brands fa-spotify"></i>
                <span>Nihongo-fy</span>
            </div>
            <div class="nav-group">
                <div class="nav-item active"><i class="fa-solid fa-house"></i> Home</div>
                <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> Cari</div>
            </div>
            <div class="library-section">
                <div class="library-header"><i class="fa-solid fa-layer-group"></i> Koleksi Kamu</div>
                <div class="playlist-list">
                    <p>Minna no Nihongo I</p>
                    <p class="secret-text">?????</p>
                </div>
            </div>
        </nav>

        <main class="main-view">
            <header class="top-bar">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Apa yang ingin kamu pelajari?">
                </div>
            </header>

            <div class="content-spacer">
                <h2>Semua Audio</h2>
                <div class="song-table-container">
                    <table class="song-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">#</th>
                                <th>Judul</th>
                                <th style="text-align: right;"><i class="fa-regular fa-clock"></i></th>
                            </tr>
                        </thead>
                        <tbody id="song-tbody">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="player-bar">
            <div class="now-playing">
                <div class="album-art"><i class="fa-solid fa-music"></i></div>
                <div class="track-info">
                    <div id="player-title" class="title">Pilih lagu...</div>
                    <div class="artist">Nihongo Audio</div>
                </div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button id="prev"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="play-pause" class="play-main"><i class="fa-solid fa-circle-play"></i></button>
                    <button id="next"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-area">
                    <span id="curr-time">0:00</span>
                    <div class="progress-bar-bg" id="progress-container">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="volume-area">
                <button id="speed-btn">1x</button>
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
        </footer>
    </div>

    <audio id="main-audio"></audio>
    <script src="script.js"></script>
</body>
</html>
