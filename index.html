<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nihonggo Audio Player</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrap">

  <h2>🎧 Nihonggo Player</h2>

  <!-- 🔎 SEARCH -->
  <input id="search" placeholder="Cari lagu (contoh: Dai 10 / Kaiwa)" />

  <!-- 🎛 CONTROL UTAMA -->
  <div class="controls">

    <button id="prev">⏮</button>

    <button id="back5">⏪5s</button>

    <button id="play">▶</button>

    <button id="forward5">5s⏩</button>

    <button id="next">⏭</button>

  </div>

  <!-- 🎵 INFO LAGU -->
  <div id="title">-</div>

  <!-- ⏱ TIME -->
  <div class="time">
    <span id="currentTime">0:00</span>
    <span>/</span>
    <span id="duration">0:00</span>
  </div>

  <!-- 📊 PROGRESS BAR (nanti bisa di-drag) -->
  <div id="progress">
    <div id="bar"></div>
  </div>

  <!-- 🔊 VOLUME -->
  <div class="volume">
    🔊 <input type="range" id="volume" min="0" max="1" step="0.01">
  </div>

  <!-- 🔁 MODE PUTAR -->
  <div class="mode">
    <button id="repeatAll">🔁 All</button>
    <button id="repeatOne">🔂 One</button>
  </div>

  <!-- 📂 PLAYLIST -->
  <div id="playlist"></div>

  <!-- 🎧 AUDIO -->
  <audio id="audio"></audio>

  <!-- 📌 COPYRIGHT -->
  <footer>
    © 2026 Faisal Yudha | IG: @faisalyudha
  </footer>

</div>

<!-- 📱 MINI PLAYER (sticky nanti di CSS) -->
<div id="mini-player">
  <span id="mini-title">-</span>
  <button id="mini-play">▶</button>
</div>

<script src="script.js"></script>

</body>
</html>
