<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nihongo Music PRO</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<div class="app">

  <div class="top">
    <h1>🎧 Nihongo Music</h1>
    <input id="search" placeholder="Cari lagu..." />
  </div>

  <!-- ALBUM INFO -->
  <div class="album">
    <div id="title">No Song</div>
    <div id="visual">🎵 ▂▃▅▇▅▃▂</div>
  </div>

  <!-- PLAYER -->
  <div class="player">

    <div id="progress">
      <div id="bar"></div>
    </div>

    <div class="time">
      <span id="current">0:00</span> / <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
      <button onclick="toggleShuffle()">🔀</button>
      <button onclick="toggleRepeat()">🔁</button>
    </div>

    <div class="volume">
      🔊 <input type="range" id="vol" min="0" max="1" step="0.01">
    </div>

  </div>

  <!-- PLAYLIST -->
  <div id="playlist"></div>

</div>

<audio id="audio"></audio>

<script src="script.js"></script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
