<!doctype html>

<html lang="id">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
🎧 Nihonggo Player
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<!-- BACKGROUND -->

<div class="bg"></div>

<div class="wrap">

<!-- HEADER -->

<div class="top">

<div class="cover">
🎧
</div>

<h1>
Nihonggo Player
</h1>

<p class="subtitle">
Belajar Japanese Listening
lebih santai ✨
</p>

<div id="title">
Loading...
</div>

</div>

<!-- PLAYER -->

<div class="player">

<!-- BUTTON -->

<div class="controls">

<button
id="prev"
class="small">

⏮

</button>

<button
id="rwd"
class="small">

-5

</button>

<button
id="play"
class="play">

▶

</button>

<button
id="ffw"
class="small">

+5

</button>

<button
id="next"
class="small">

⏭

</button>

</div>

<!-- PROGRESS -->

<div class="progress-container">

<span id="current">

0:00

</span>

<div class="progress">

<div id="bar"></div>

</div>

<span id="duration">

0:00

</span>

</div>

</div>

<!-- PLAYLIST -->

<div id="playlist"></div>

<!-- FOOTER -->

<footer>

<p>
© 2026 Faisal Yudha
</p>

<p>
Instagram:
@faisalyudha
</p>

</footer>

</div>

<!-- AUDIO -->

<audio id="audio"></audio>

<!-- JS -->

<script src="script.js"></script>

</body>
</html>
