<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Audio Player Minna Nihonggo</title>
  <style>
    :root{
      --bg:#0f1720; 
      --card:#0f1728; 
      --muted:#9aa6b2; 
      --accent:#1db954; 
      --main-text:#e6eef3;
      --shadow-light:rgba(255,255,255,0.05);
      --shadow-dark:rgba(0,0,0,0.6);
      --glass:rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background:linear-gradient(180deg,#071021 0%,#0b1220 100%);
      color:var(--main-text);
      padding:28px;
    }
    .wrap{max-width:500px;margin:0 auto;display:grid;gap:22px}

    .main-player-card{
      background:var(--card);
      border-radius:18px;
      box-shadow:inset 8px 8px 16px var(--shadow-dark),inset -8px -8px 16px var(--shadow-light);
      overflow:hidden;
      padding-bottom:20px;
    }
    .visual-header{
      background:linear-gradient(180deg,#1db954 0%,rgba(15,23,40,0) 100%);
      padding:30px 22px 70px 22px;
      text-align:center;
      color:white;
    }
    .visual-header h1{font-size:26px;font-weight:700;margin:0}
    .visual-header .meta{font-size:13px;color:rgba(255,255,255,0.9);margin-top:4px}
    .player-controls-area{position:relative;margin-top:-50px;z-index:10;padding:0 22px}
    .main-controls-group{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:25px}

    .bigbtn{
      width:64px;height:64px;border-radius:999px;border:none;
      background:var(--accent);color:white;
      box-shadow:8px 8px 16px rgba(0,0,0,0.4),-8px -8px 16px rgba(255,255,255,0.15);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .2s ease-out;
    }
    .bigbtn:hover{transform:scale(1.05)}
    .smbtn{
      width:44px;height:44px;border-radius:999px;border:none;
      background:var(--card);color:var(--muted);
      display:flex;align-items:center;justify-content:center;
      box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light);
      cursor:pointer;transition:all .2s;
    }
    .smbtn:hover{background:var(--glass);color:var(--main-text)}
    .smbtn.active-control{color:var(--accent)}
    .track-info{text-align:center;margin-bottom:5px}
    .title{font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
    .audio-visualizer{display:flex;justify-content:center;gap:10px;height:15px;color:var(--muted);font-size:13px}
    .visual-bars-group{display:flex;align-items:flex-end;height:15px;gap:2px}
    .bar-item{width:3px;border-radius:999px;background-color:var(--accent);transition:height .05s ease-out}

    .progress{height:12px;background:rgba(255,255,255,0.08);border-radius:999px;cursor:pointer;position:relative;margin:15px 0 8px}
    .progress>.bar{height:100%;width:0;background:var(--accent);border-radius:999px}
    .time{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
    .controlsBottom{display:flex;align-items:center;justify-content:space-between;padding-top:20px;border-top:1px solid rgba(255,255,255,0.05);margin-top:10px}

    .playlist-card{background:var(--card);padding:18px;border-radius:12px;box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light)}
    .playlist-scroll-area{max-height:350px;overflow-y:auto;padding-right:5px}
    .playlist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,0.05)}
    .track{display:flex;align-items:center;padding:10px;border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:14px}
    .track:hover{background:rgba(255,255,255,0.05)}
    .track .num{width:30px;color:var(--muted);flex-shrink:0}
    .track.active{background:rgba(29,185,84,0.1);color:#fff;font-weight:500}
    .track.active .num{color:var(--accent)}
    .equalizer-icon{display:none;width:15px;height:15px;align-items:flex-end;gap:2px;margin-left:10px}
    .track.active .equalizer-icon{display:flex}
    .eq-bar{width:3px;background-color:var(--accent);border-radius:1px;height:5px}
    .copyright{text-align:center;padding-top:10px;border-top:1px solid rgba(255,255,255,0.03);color:var(--muted);font-size:11px}
  </style>
</head>
<body>
<div class="wrap">
  <section class="main-player-card">
    <div class="visual-header">
      <h1>Minna Nihonggo Audio</h1>
      <div class="meta">Pelajaran Tata Bahasa dan Percakapan</div>
    </div>

    <div class="player-controls-area">
      <div class="main-controls-group">
        <button id="prev" class="smbtn">⏮️</button>
        <button id="rwd" class="smbtn">⏪5s</button>
        <button id="play" class="bigbtn">▶</button>
        <button id="ffw" class="smbtn">⏩5s</button>
        <button id="next" class="smbtn">⏭️</button>
      </div>

      <div class="track-info">
        <div class="title" id="nowTitle">01 Dai 1 Ka - Kaiwa</div>
        <div class="audio-visualizer"><div class="visual-bars-group">
          <div class="bar-item"></div><div class="bar-item"></div><div class="bar-item"></div><div class="bar-item"></div><div class="bar-item"></div>
        </div></div>
      </div>

      <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
      <div class="time"><span id="current">0:00</span><span id="duration">0:00</span></div>

      <div class="controlsBottom">
        <button id="shuffle" class="smbtn">🔀</button>
        <div><label>Speed</label> <select id="speed"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div>
        <div><label>Volume</label> <input id="vol" type="range" min="0" max="1" step="0.01" value="1"></div>
        <button id="loop" class="smbtn">🔁</button>
      </div>
    </div>
    <div class="copyright">&copy; 2025 Yudha. All rights reserved.</div>
  </section>

  <aside class="playlist-card">
    <div class="playlist-header"><strong>Playlist (89)</strong>
      <button id="playAll" class="smbtn">▶ All</button>
    </div>
    <div class="playlist-scroll-area"><div class="playlist" id="playlist"></div></div>
  </aside>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const files = [
"01 Dai 1 Ka - Kaiwa.mp3","02 Dai 1 Ka - Mondai 1.mp3","03 Dai 1 Ka - Mondai 2.mp3","04 Dai 1 Ka - Mondai 3.mp3",
"05 Dai 2 Ka - Kaiwa.mp3","06 Dai 2 Ka - Mondai 1.mp3","07 Dai 2 Ka - Mondai 2.mp3","08 Dai 2 Ka - Mondai 3.mp3",
"09 Dai 3 Ka - Kaiwa.mp3","10 Dai 3 Ka - Mondai 1.mp3","11 Dai 3 Ka - Mondai 2.mp3","12 Dai 4 Ka - Kaiwa.mp3",
"13 Dai 4 Ka - Mondai 1.mp3","14 Dai 4 Ka - Mondai 2.mp3","15 Dai 4 Ka - Mondai 3.mp3","16 Dai 4 Ka - Mondai 4.mp3",
"17 Dai 5 Ka - Kaiwa.mp3","18 Dai 5 Ka - Mondai 1.mp3","19 Dai 5 Ka - Mondai 2.mp3","20 Dai 5 Ka - Mondai 3.mp3",
"21 Dai 6 Ka - Kaiwa.mp3","22 Dai 6 Ka - Mondai 1.mp3","23 Dai 6 Ka - Mondai 2.mp3","24 Dai 7 Ka - Kaiwa.mp3",
"25 Dai 7 Ka - Mondai 1.mp3","26 Dai 7 Ka - Mondai 2.mp3","27 Dai 7 Ka - Mondai 3.mp3","28 Dai 8 Ka - Kaiwa.mp3",
"29 Dai 8 Ka - Mondai 1.mp3","30 Dai 8 Ka - Mondai 2.mp3","31 Dai 8 Ka - Mondai 3.mp3","32 Dai 9 Ka - Kaiwa.mp3",
"33 Dai 9 Ka - Mondai 1.mp3","34 Dai 9 Ka - Mondai 2.mp3","35 Dai 10 Ka - Kaiwa.mp3","36 Dai 10 Ka - Mondai 1.mp3",
"37 Dai 10 Ka - Mondai 2.mp3","38 Dai 10 Ka - Mondai 3.mp3","39 Dai 11 Ka - Kaiwa.mp3","40 Dai 11 Ka - Mondai 1.mp3",
"41 Dai 11 Ka - Mondai 2.mp3","42 Dai 11 Ka - Mondai 3.mp3","43 Dai 12 Ka - Kaiwa.mp3","44 Dai 12 Ka - Mondai 1.mp3",
"45 Dai 12 Ka - Mondai 2.mp3","46 Dai 13 Ka - Kaiwa.mp3","47 Dai 13 Ka - Mondai 1.mp3","48 Dai 13 Ka - Mondai 2.mp3",
"49 Dai 14 Ka - Kaiwa.mp3","50 Dai 14 Ka - Mondai 1.mp3","51 Dai 14 Ka - Mondai 2.mp3","52 Dai 14 Ka - Mondai 3.mp3",
"53 Dai 15 Ka - Kaiwa.mp3","54 Dai 15 Ka - Mondai 1.mp3","55 Dai 15 Ka - Mondai 2.mp3","56 Dai 16 Ka - Kaiwa.mp3",
"57 Dai 16 Ka - Mondai 1.mp3","58 Dai 16 Ka - Mondai 2.mp3","59 Dai 16 Ka - Mondai 3.mp3","60 Dai 17 Ka - Kaiwa.mp3",
"61 Dai 17 Ka - Mondai 1.mp3","62 Dai 17 Ka - Mondai 2.mp3","63 Dai 18 Ka - Kaiwa.mp3","64 Dai 18 Ka - Mondai 1.mp3",
"65 Dai 18 Ka - Mondai 2.mp3","66 Dai 19 Ka - Kaiwa.mp3","67 Dai 19 Ka - Mondai 1.mp3","68 Dai 19 Ka - Mondai 2.mp3",
"69 Dai 20 Ka - Kaiwa.mp3","70 Dai 20 Ka - Mondai 1.mp3","71 Dai 20 Ka - Mondai 2.mp3","72 Dai 21 Ka - Kaiwa.mp3",
"73 Dai 21 Ka - Mondai 1.mp3","74 Dai 21 Ka - Mondai 2.mp3","75 Dai 22 Ka - Kaiwa.mp3","76 Dai 22 Ka - Mondai 1.mp3",
"77 Dai 22 Ka - Mondai 2.mp3","78 Dai 23 Ka - Kaiwa.mp3","79 Dai 23 Ka - Mondai 1.mp3","80 Dai 23 Ka - Mondai 2.mp3",
"81 Dai 23 Ka - Mondai 3.mp3","82 Dai 24 Ka - Kaiwa.mp3","83 Dai 24 Ka - Mondai 1.mp3","84 Dai 24 Ka - Mondai 2.mp3",
"85 Dai 25 Ka - Kaiwa.mp3","86 Dai 25 Ka - Mondai 1.mp3","87 Dai 25 Ka - Mondai 2.mp3","88 Juned.mp3","89 Yanto.mp3"
];

const audio=document.getElementById("audio");
const playBtn=document.getElementById("play");
const nowTitle=document.getElementById("nowTitle");
const playlist=document.getElementById("playlist");
let current=0;

function loadTrack(i){
  current=i;
  audio.src=files[i];
  nowTitle.textContent=files[i].replace(".mp3","");
}
function playTrack(){audio.play();playBtn.textContent="⏸️";}
function pauseTrack(){audio.pause();playBtn.textContent="▶";}
playBtn.onclick=()=>{audio.paused?playTrack():pauseTrack();}
document.getElementById("next").onclick=()=>{current=(current+1)%files.length;loadTrack(current);playTrack();}
document.getElementById("prev").onclick=()=>{current=(current-1+files.length)%files.length;loadTrack(current);playTrack();}
document.getElementById("playAll").onclick=()=>{loadTrack(0);playTrack();}

files.forEach((f,i)=>{
  const el=document.createElement("div");
  el.className="track";
  el.textContent=`${String(i+1).padStart(2,"0")} ${f.replace(".mp3","")}`;
  el.onclick=()=>{loadTrack(i);playTrack();}
  playlist.appendChild(el);
});

loadTrack(0);
</script>
</body>
</html>
