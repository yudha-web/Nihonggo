<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Audio Player Minna Nihongo</title>

<style>
body{
  background:#0f1720;
  color:white;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.player{
  background:#1a2233;
  padding:20px;
  border-radius:15px;
  width:300px;
  text-align:center;
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
}

button{
  padding:10px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  background:#2c3a55;
  color:white;
  font-size:14px;
}

button:hover{
  background:#1db954;
}

.big{
  width:60px;
  height:60px;
  font-size:18px;
}

.active{
  background:#1db954;
}
</style>
</head>

<body>

<div class="player">
  <h3 id="title">Audio</h3>

  <audio id="audio"></audio>

  <div class="controls">
    <button id="rwd">⏪5</button>
    <button id="play" class="big">▶</button>
    <button id="ffw">5⏩</button>
  </div>

  <div class="controls">
    <button id="repeatOne">🔁1</button>
    <button id="abloop">A↔B</button>
  </div>
</div>

<script>

// ================= FILE =================
const files = [
  "01 Dai 1 Ka - Kaiwa.mp3",
  "02 Dai 1 Ka - Mondai 1.mp3"
];

// ================= ELEMENT =================
const audio = document.getElementById('audio');
const playBtn = document.getElementById('play');
const rwdBtn = document.getElementById('rwd');
const ffwBtn = document.getElementById('ffw');
const repeatBtn = document.getElementById('repeatOne');
const abBtn = document.getElementById('abloop');
const title = document.getElementById('title');

// ================= STATE =================
let current = 0;
let isPlaying = false;

// A-B LOOP
let loopA = null;
let loopB = null;
let isABLoop = false;

// REPEAT
let repeatOne = false;

// ================= FUNCTION =================
function loadTrack(i){
  current = i;
  audio.src = files[i];
  title.textContent = files[i];
}

function togglePlay(){
  if(audio.paused){
    audio.play();
    playBtn.textContent = "⏸";
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
}

// ================= CONTROL =================

// ✅ FIX 5 DETIK (INI YANG PENTING)
rwdBtn.onclick = ()=>{
  audio.currentTime = Math.max(0, audio.currentTime - 5);
};

ffwBtn.onclick = ()=>{
  audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
};

// PLAY
playBtn.onclick = togglePlay;

// ================= A-B LOOP =================
abBtn.onclick = ()=>{
  if(loopA === null){
    loopA = audio.currentTime;
    abBtn.textContent = "A✓";
  } else if(loopB === null){
    loopB = audio.currentTime;
    isABLoop = true;
    abBtn.textContent = "AB✓";
  } else {
    loopA = null;
    loopB = null;
    isABLoop = false;
    abBtn.textContent = "A↔B";
  }
};

// ================= REPEAT =================
repeatBtn.onclick = ()=>{
  repeatOne = !repeatOne;
  repeatBtn.classList.toggle('active', repeatOne);
};

// ================= EVENT =================
audio.addEventListener('timeupdate', ()=>{
  if(isABLoop && loopA !== null && loopB !== null){
    if(audio.currentTime >= loopB){
      audio.currentTime = loopA;
    }
  }
});

audio.addEventListener('ended', ()=>{

  if(repeatOne){
    audio.currentTime = 0;
    audio.play();
    return;
  }

  current = (current + 1) % files.length;
  loadTrack(current);
  audio.play();
});

// ================= KEYBOARD =================
document.addEventListener('keydown', (e)=>{
  if(e.code === 'Space'){
    e.preventDefault();
    togglePlay();
  }
  if(e.code === 'ArrowRight'){
    audio.currentTime += 5;
  }
  if(e.code === 'ArrowLeft'){
    audio.currentTime -= 5;
  }
});

// INIT
loadTrack(0);

</script>

</body>
</html>
